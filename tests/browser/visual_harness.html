<!doctype html>
<html lang="en" data-codex-jev-route-kind="local" data-codex-jev-session-id="synthetic-doc-session">
<head>
  <meta charset="utf-8">
  <title>Jev composer illustration</title>
  <style>
    body { margin: 0; background: #191919; color: #bcbcbc; font: 17px "Segoe UI", sans-serif; }
    .composer { position: fixed; left: 18px; right: 18px; bottom: 18px; height: 125px; border: 1px solid #353535; border-radius: 24px; background: #202020; }
    .prompt { margin: 27px 30px; color: #777; font-size: 20px; }
    .toolbar { position: absolute; left: 24px; right: 24px; bottom: 15px; height: 36px; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .toolbar button { border: 0; background: none; color: inherit; font: inherit; padding: 0; }
    .plus { font-size: 27px; color: #c9c9c9; line-height: 1; }
    .access { display: inline-flex; align-items: center; gap: 8px; flex: none; color: #d6b900 !important; font-size: 16px !important; }
    .shield { display: block; width: 20px; height: 22px; }
    .model { box-sizing: border-box; margin-left: auto; color: #bebebe !important; font-size: 16px !important; height: 36px; padding: 5px 13px !important; border-radius: 999px; }
    .model:hover { background: #303030 !important; }
    .divider { height: 34px; border-left: 1px solid #303030; }
    .context { display: inline-flex; align-items: center; gap: 7px; color: #989898; font-size: 15px; }
    .context svg { width: 18px; height: 18px; }
    .mic { display: grid; place-items: center; width: 22px; height: 30px; flex: none; color: #c3c3c3; }
    .mic svg { width: 20px; height: 20px; }
    .send { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 50%; background: #c5c5c5; color: #202020; margin-left: 3px; }
    .send svg { width: 23px; height: 23px; }
    .codex-login { display: none; position: fixed; inset: 0; background: #111214; color: #f4f4f4; }
    .codex-login header { padding: 22px 30px; font-size: 21px; font-weight: 650; }
    .codex-login main { position: absolute; top: 48%; left: 24%; width: min(320px, calc(100% - 32px)); transform: translate(-50%, -50%); text-align: center; }
    .codex-login h1 { margin: 0 0 15px; font-size: 34px; font-weight: 650; }
    .codex-login p { margin: 0 0 32px; color: #b0b0b0; font-size: 16px; }
    .codex-login button { display: block; width: 100%; height: 42px; margin-top: 11px; border: 1px solid #3d3f42; border-radius: 9px; background: #242628; color: #f4f4f4; font: inherit; }
    body[data-demo="onboarding"] .codex-login { display: block; }
    body[data-demo="onboarding"] .composer { display: none; }
    body[data-demo="onboarding"] #codex-jev-connect { justify-content: flex-end; padding-right: 28px; background: #11121477; backdrop-filter: blur(1px); }
    body[data-demo="onboarding"] #codex-jev-connect-card { margin: auto 0 auto auto; }
    body[data-demo="onboarding"] #codex-jev-connect-art { display: none; }
    .settings-screen { display: none; position: fixed; inset: 0; z-index: 10; background: #181818; color: #d2d2d2; }
    body[data-demo="settings"] .settings-screen { display: block; }
    body[data-demo="settings"] .composer { display: none; }
    .settings-nav { box-sizing: border-box; width: 210px; height: 100%; padding: 25px 12px; border-right: 1px solid #323232; }
    .settings-nav strong { display: block; margin: 0 12px 25px; font-size: 22px; }
    .settings-nav button { display: block; width: 100%; padding: 10px 13px; border: 0; border-radius: 7px; background: transparent; color: #c9c9c9; text-align: left; font: inherit; }
    .settings-nav button svg, .settings-nav button img { display: inline-block; width: 16px; height: 16px; margin-right: 10px; vertical-align: middle; }
    .settings-nav [aria-current=page] { background: #303030; color: #f3f3f3; }
    .settings-content { position: absolute; inset: 0 0 0 210px; overflow: auto; padding: 28px; }
    @media (max-width: 700px) { .divider, .context { display: none; } }
    /* Match the headless screenshot surface to its smaller layout viewport. */
    #codex-jev { transform: translateY(var(--screenshot-offset, 0px)); }
  </style>
  <script>
    document.documentElement.style.setProperty("--screenshot-offset", `${Math.max(0, outerHeight - innerHeight)}px`);
    const demo = new URLSearchParams(location.search).get("demo") || "tooltip";
    const disabled = demo === "disabled" || demo === "disabled-pending";
    const history = ["judged 42 lines · omitted 29 · test/build"];
    window.acquireVsCodeApi = () => ({ postMessage(request) {
      const settings = request.action === "settingsRead" ? { action: "ready", hasKey: true, keyLength: 32,
        lifetime: { calls: 126, completed: 124, replaced: 41, linesJudged: 87320, linesOmitted: 915,
          linesProtected: 1420, linesRelevanceJudged: 6200, averageMs: 487 },
        defaults: { mode: "replace", line_policy: {
          output: { omit_min: 95, exact_max: 5 }, test_build: { omit_min: 95, exact_max: 5 },
          search_listing: { omit_min: 95, exact_max: 5 } },
          search_relevance: { guard_enabled: false, relevant_max: 5 }, choice_gate_enabled: true },
        config: { mode: "replace", log_limit_mb: 50, never_delete_logs: true, choice_gate_enabled: true,
          search_relevance: { guard_enabled: false, relevant_max: 5 },
          line_policy: { output: { omit_min: 95, exact_max: 5 },
            test_build: { omit_min: 95, exact_max: 5 }, search_listing: { omit_min: 95, exact_max: 5 } } } } :
        request.action === "settingsTest" ? { action: "tested", result: { ok: true, model: "jev-1.13.0" } } : undefined;
      queueMicrotask(() => window.dispatchEvent(new MessageEvent("message", { data: {
        type: "codex-jev-reply", id: request.id,
        status: {
          enabled: !disabled, outputEnabled: !disabled, testBuildEnabled: !disabled, searchListingEnabled: !disabled,
          needsKey: demo === "onboarding" || demo === "missing-key",
          health: demo === "disabled-pending" ? null :
            demo === "onboarding" || demo === "missing-key" ? { ok: false, reason: "JEV_KEY_MISSING" } :
            demo === "unavailable" ? { ok: false, reason: "JEV_TIMEOUT" } : { ok: true, model: "jev-1.13.0" },
          hookHealth: disabled || demo === "pending" ? null :
            { version: 1, hook_version: "0.8.1", last_seen_ms: Date.now(), last_success_ms: Date.now() },
          expectedHookVersion: "0.8.1",
          viewStartedAt: Date.now() - 1000,
          busy: demo === "pulse", mode: "replace", recent: history[0], history: disabled ? [] : history,
          stats: disabled ? {} : { calls: 1, candidates: 1, kept: 0, replaced: 1, checkedChars: 6367, savedChars: 6058, estimatedTokensSaved: 1515, elapsedMs: 1263, completed: 1 },
          settings,
        },
      } })));
    } });
  </script>
  <script src="../../vscode-control/webview/jev-control.js"></script>
  <script src="../../vscode-control/webview/jev-settings.js"></script>
</head>
<body>
  <div class="codex-login" aria-hidden="true"><header>Codex</header><main><h1>Welcome to Codex</h1><p>Sign in to continue</p><button>Sign in with ChatGPT</button><button>Use an API key</button></main></div>
  <div class="composer">

    <div class="toolbar">

      <button class="model">GPT-6 Sol Extra High&nbsp;⌄</button>
      <span class="divider"></span><span class="context"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 6 12 1.6-4.6L15 9 3 3Zm11-5v3m-6 0 2 2m7 0-2 2m3 4h-3"/></svg>IDE context</span>
      <span class="mic" aria-label="Microphone"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="6" height="11" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v3m-3.5 0h7"/></svg></span>
      <span class="send" aria-label="Send prompt"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4m-6.5 6.5L12 4l6.5 6.5"/></svg></span>
    </div>
  </div>
  <div class="settings-screen">
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <symbol id="settings-general" viewBox="0 0 16 16"><path d="M2 4h5m3 0h4M2 8h2m3 0h7M2 12h8m3 0h1"/><circle cx="8.5" cy="4" r="1.5"/><circle cx="5.5" cy="8" r="1.5"/><circle cx="11.5" cy="12" r="1.5"/></symbol>

      <symbol id="settings-personalization" viewBox="0 0 16 16"><path d="m8 1.5 1.4 4.3L14 7.5 9.4 9.2 8 13.5 6.6 9.2 2 7.5l4.6-1.7L8 1.5ZM12.5 12l.5 1.4 1.5.6-1.5.6-.5 1.4-.5-1.4-1.5-.6 1.5-.6.5-1.4Z"/></symbol>

      <symbol id="settings-hooks" viewBox="0 0 16 16"><path d="M8 1.5v8a3 3 0 1 0 3 3"/><path d="m5.5 4 2.5-2.5L10.5 4"/></symbol>

    </svg>
    <nav class="settings-nav" aria-label="Settings">
      <strong>Settings</strong>
      <div class="settings-items">
        <div class="settings-item"><button aria-label="General"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><use href="#settings-general"/></svg><span>General</span></button></div>
        <div class="settings-item"><button aria-label="Voice" aria-current="page"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="1.5" width="5" height="9" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2M5.5 14.5h5"/></svg><span>Voice</span></button></div>
        <div class="settings-item"><button aria-label="Configuration"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><use href="#settings-configuration"/></svg><span>Configuration</span></button></div>
        <div class="settings-item"><button aria-label="Personalization"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><use href="#settings-personalization"/></svg><span>Personalization</span></button></div>
        <div class="settings-item"><button aria-label="Usage &amp; billing"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><use href="#settings-usage"/></svg><span>Usage &amp; billing</span></button></div>
        <div class="settings-item"><button aria-label="MCP servers"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><use href="#settings-mcp"/></svg><span>MCP servers</span></button></div>
        <div class="settings-item"><button aria-label="Hooks"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><use href="#settings-hooks"/></svg><span>Hooks</span></button></div>
        <div class="settings-item"><button aria-label="Plugins"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><use href="#settings-plugins"/></svg><span>Plugins</span></button></div>
      </div>
    </nav>
    <div class="settings-content"><main><h1>Voice</h1><p>Voice settings</p></main></div>
  </div>
  <script>
    const api = acquireVsCodeApi();
    document.body.dataset.demo = demo;
    setTimeout(() => {
      document.documentElement.style.setProperty("--screenshot-offset", `${Math.max(0, outerHeight - innerHeight)}px`);
      if (demo !== "composer") document.querySelector(".prompt").textContent = "";
      if (demo === "onboarding") document.getElementById("codex-jev-connect-icon").src = "../../vscode-control/icon.png";
      if (demo === "missing-key") document.getElementById("codex-jev-skip-key").click();
      if (demo === "menu") document.getElementById("codex-jev-button").click();
      else if (demo !== "composer" && demo !== "onboarding" && demo !== "settings") document.getElementById("codex-jev-tip").style.display = "block";
      if (demo === "settings") {
        document.documentElement.dataset.codexJevRouteKind = "none";
        delete document.documentElement.dataset.codexJevSessionId;
        document.querySelector('[data-codex-jev-settings="true"]')?.click();
        document.querySelector('[data-codex-jev-settings="true"] img')?.setAttribute("src", "../../vscode-control/icon.png");
      }
      const anchor = document.querySelector(".access").getBoundingClientRect();
      const button = document.getElementById("codex-jev-button").getBoundingClientRect();
      document.body.dataset.layout = JSON.stringify({ anchorTop: anchor.top, buttonTop: button.top, screenshotOffset: Math.max(0, outerHeight - innerHeight) });
      document.title = "JEV_VISUAL_READY";
    }, 350);
  </script>
</body>
</html>
