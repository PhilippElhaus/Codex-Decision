        window.__jevHarnessLastSettingsSave.fallbackEnabled === true,
        "save submits the reset line policy");
      const settingsTest = settingsScreen.querySelector("#codex-decision-settings-test");
      const settingsMessage = settingsScreen.querySelector("#codex-decision-settings-message");
      for (const control of [settingsTest, saveSettings, neverDelete]) {
        window.__jevHarnessDropSettingsReplies = true;
        control.click();
        check(settingsTest.disabled && saveSettings.disabled, "settings waits for its host acknowledgement");
        const dropped = window.__jevHarnessHeldSettings;
        Date.now = () => actualNow() + 11000;
        await until(() => !saveSettings.disabled && settingsMessage.textContent.includes("Codex did not reply"),
          "missing settings reply times out and releases all controls");
        Date.now = actualNow;
        check(!neverDelete.checked && !logLimit.disabled, "timed out retention restores the saved checkbox");
        window.__jevHarnessDropSettingsReplies = false;
        settingsTest.click();
        await until(() => settingsScreen.querySelector("#codex-decision-settings-test-status").textContent === "Connection verified",
          "settings request works after timeout");
        window.dispatchEvent(new MessageEvent("message", { data: { type: "codex-decision-reply", id: dropped.id,
          status: { settings: { action: "error", message: "obsolete reply" } } } }));
        check(!settingsMessage.textContent.includes("obsolete reply"), "late settings replies cannot replace recovery");
      }
      window.__jevHarnessThrowSettings = true;
      settingsTest.click();
      check(!saveSettings.disabled && settingsMessage.textContent.includes("Codex did not reply"),
        "synchronous settings transport failure releases the request");
      window.__jevHarnessThrowSettings = false;
      logLimit.value = "9999";
      neverDelete.click();
      await until(() => window.__jevHarnessNeverDelete && !neverDelete.disabled, "checkbox saved before full save");
      saveSettings.click();
      await until(() => window.__jevHarnessLastSettingsSave?.logLimitMb === 9999 &&
        window.__jevHarnessLastSettingsSave.neverDeleteLogs === true,
        "never delete and maximum limit are sent together");
      settingsScreen.querySelector('button[aria-label="General"]').click();
      check(settingsScreen.querySelector("main").style.display !== "none" &&
        !settingsScreen.querySelector("#codex-decision-settings-panel"), "native settings return after navigation");
      settingsScreen.querySelector(".settings-content").innerHTML = "<div><h3>Voice controls</h3></div>";
      jevSettings.click();
      await until(() => settingsScreen.querySelector("#codex-decision-settings-panel") &&
        settingsScreen.querySelector(".settings-content > div").style.display === "none",
        "Decision opens in the Codex content shell without a Voice heading or main element");
      await until(() => !settingsScreen.querySelector("#codex-decision-settings-never-delete").disabled,
        "reopened settings loads saved retention");
      check(settingsScreen.querySelector("#codex-decision-settings-never-delete").checked &&
        settingsScreen.querySelector("#codex-decision-settings-key").placeholder === "Leave blank to keep saved credential" &&
        settingsScreen.querySelector("#codex-decision-settings-fallback").checked &&
        settingsScreen.querySelector("#codex-decision-settings-output-relevant_max").value === "5%",
        "retention, line policy, saved key status, and fallback consent persist after reopening settings");
      const customField = name => settingsScreen.querySelector(`#codex-decision-settings-${name}`);
      customField("provider").value = "custom";
      customField("provider").dispatchEvent(new Event("change", { bubbles: true }));
      customField("name").value = "Local decisions";
      customField("endpoint").value = "http://127.0.0.1:8080/v1/decisions";
      customField("model").value = "local-model";
      customField("auth").value = "basic";
      customField("auth").dispatchEvent(new Event("change", { bubbles: true }));
      customField("username").value = "test-user";
      customField("password").value = "synthetic-password";
      check(!customField("username").closest(".field").hidden && !customField("password").closest(".field").hidden &&
        customField("key").closest(".field").hidden && customField("fallback").closest(".fallback-setting").hidden && !customField("fallback").checked,
        "custom Basic auth reveals username and password and disables built-in fallback");
      for (const auth of ["header", "none", "bearer", "basic"]) {
        customField("auth").value = auth;
        customField("auth").dispatchEvent(new Event("change", { bubbles: true }));
        check(customField("header-name").closest(".field").hidden === (auth !== "header") &&
          customField("key").closest(".field").hidden === ["none", "basic"].includes(auth),
          `custom ${auth} authentication exposes only its relevant fields`);
      }
      check(customField("password").value === "", "changing authentication clears an entered custom credential");
      customField("password").value = "synthetic-password";
      const beforeCustomSave = window.__jevHarnessLastSettingsSave;
      window.__jevHarnessSettingsTestResult = { ok: false, reason: "DECISION_INVALID_RESPONSE" };
      customField("save").click();
      await until(() => customField("test-status").textContent === "Invalid response", "invalid custom schema is reported");
      check(window.__jevHarnessLastSettingsSave === beforeCustomSave, "failed draft test leaves saved settings unchanged");
      window.__jevHarnessSettingsTestResult = null;
      const beforeCustomActions = window.__jevHarnessActions.length;
      customField("save").click();
      await until(() => window.__jevHarnessLastSettingsSave?.provider === "custom" && !customField("save").disabled, "custom draft tests then saves");
      check(window.__jevHarnessActions.slice(beforeCustomActions).filter(action => action.startsWith("settings")).join(",") === "settingsTest,settingsSave" &&
        window.__jevHarnessLastSettingsSave.customProvider.username === "test-user" &&
        window.__jevHarnessLastSettingsSave.customProvider.model === "local-model" && customField("password").value === "",
        "verified custom connection is saved with private password and clears the password field");
      const customPanel = settingsScreen.querySelector("#codex-decision-settings-panel");
      check(customPanel.scrollWidth <= customPanel.clientWidth + 1, "custom settings contain all fields at this viewport");
      customField("provider").value = "openai";
      customField("provider").dispatchEvent(new Event("change", { bubbles: true }));
      customField("save").click();
      await until(() => window.__jevHarnessProvider === "openai" && !customField("save").disabled, "built-in provider restored after custom settings");
      settingsScreen.querySelector('button[aria-label="General"]').click();
      settingsScreen.style.display = "none";
      outputEnabled = true;
      needsKey = true;
      window.__jevHarnessProviderKeys.typesafe = { hasKey: true };
      health = { ok: false, reason: "DECISION_KEY_MISSING" };
      const setup = document.getElementById("codex-decision-connect");
      await until(() => setup.style.display === "flex", "missing key opens over Codex pane");
      setup.querySelector("#codex-decision-connect-icon").src = "../../vscode-control/icon.png";
      const bounds = setup.getBoundingClientRect();
      check(bounds.left === 0 && bounds.top === 0 && bounds.width === innerWidth &&
        bounds.height === innerHeight && setup.parentElement === document.body,
        "setup covers the Codex webview");
      check(setup.textContent.includes("Choose a provider and test your connection.") &&
        !setup.textContent.includes("Test it here before saving") &&
        !setup.textContent.includes("plugin data directory"), "concise onboarding copy");
      check(getComputedStyle(setup).backgroundColor === "rgb(17, 17, 17)", "opaque setup backdrop hides Codex content");
      const keyLink = setup.querySelector("#codex-decision-connect-link a");
      check(keyLink?.href === "https://platform.openai.com/api-keys" &&
        getComputedStyle(keyLink.parentElement).textAlign === "center", "Provider key link is centered below actions");
      const linkClick = new MouseEvent("click", { bubbles: true, cancelable: true });
      const navigated = keyLink.dispatchEvent(linkClick);
      check(!navigated && linkClick.defaultPrevented && window.__jevHarnessLastAction === "openProvider" &&
        setup.style.display === "flex", "Provider link asks the extension to open the browser without navigating the webview");
      window.__jevHarnessExternalOpen = false;
      keyLink.click();
      await until(() => setup.querySelector("#codex-decision-key-status").textContent === "Could not open browser",
        "browser launch failure is shown in Connect Decision");
      window.__jevHarnessExternalOpen = true;
      const footer = setup.querySelector("#codex-decision-connect-footer");
      const saveButton = setup.querySelector("#codex-decision-save-key");
      const skipButton = setup.querySelector("#codex-decision-skip-key");
      check((innerWidth <= 420 ? skipButton.getBoundingClientRect().top >= saveButton.getBoundingClientRect().bottom :
        Math.abs(saveButton.getBoundingClientRect().top - skipButton.getBoundingClientRect().top) < 1) &&
        footer.contains(saveButton) && footer.contains(skipButton) &&
        Math.abs(skipButton.getBoundingClientRect().right - footer.getBoundingClientRect().right) < 2,
        "Connect actions fit the panel width");
      setup.style.width = "300px";
      setup.style.right = "auto";
      await pause(30);
      const card = setup.querySelector("#codex-decision-connect-card");
      check(card.scrollWidth <= card.clientWidth + 1 &&
        saveButton.getBoundingClientRect().right <= card.getBoundingClientRect().right &&
        skipButton.getBoundingClientRect().right <= card.getBoundingClientRect().right &&
        skipButton.getBoundingClientRect().top > saveButton.getBoundingClientRect().top &&
        setup.querySelector("#codex-decision-connect-icon").getBoundingClientRect().right <= card.getBoundingClientRect().right,
        "narrow Connect Decision panel contains heading, icon, and both actions");
      setup.style.width = "";
      setup.style.right = "";
      check(setup.querySelector("#codex-decision-connect-icon").getAttribute("src") === "../../vscode-control/icon.png" &&
        getComputedStyle(setup.querySelector("#codex-decision-connect-art pre")).animationName ===
          (matchMedia("(prefers-reduced-motion: reduce)").matches ? "none" : "codex-decision-art-drift"),
        "Decision icon and motion-aware ASCII backdrop");
      setup.querySelector("#codex-decision-skip-key").click();
      check(setup.style.display === "none" && needsKey, "Skip restores Codex without saving a key");
      const missingTip = document.getElementById("codex-decision-tip");
      missingTip.style.display = "block";
      check(missingTip.dataset.needsKey === "true" &&
        missingTip.getBoundingClientRect().width <= 253 &&
        getComputedStyle(missingTip.querySelector("#codex-decision-session-heading")).display === "none" &&
        missingTip.querySelector("#codex-decision-retry").textContent === "Connect",
        "missing-key tooltip is compact and action-oriented");
      missingTip.style.display = "";
      missingTip.querySelector("#codex-decision-retry").click();
      check(setup.style.display === "flex", "tooltip Connect reopens setup");
      skipButton.click();
      missingTip.querySelector("#codex-decision-retry").click();
      check(setup.style.display === "flex", "Connect remains reachable after skipping setup");
      const key = setup.querySelector("#codex-decision-key");
      const result = setup.querySelector("#codex-decision-key-status");
      const connectProvider = setup.querySelector("#codex-decision-provider");
      key.value = "synthetic-openai-draft";
      connectProvider.value = "typesafe";
      connectProvider.dispatchEvent(new Event("change", {bubbles:true}));
      check(key.value === "" && keyLink.href === "https://typesafe.ai/" &&
        saveButton.textContent === "Test & save connection", "connect provider change clears the key and exposes its saved key");
      setup.querySelector("#codex-decision-test-key").click();
      await until(() => result.textContent === "OK", "stored alternate key can be tested with blank input");
      check(window.__jevHarnessLastRequest.key === "" && window.__jevHarnessLastRequest.provider === "typesafe",
        "saved-key test selects the stored provider without reentry");
      saveButton.click();
      await until(() => setup.style.display === "none" && !needsKey, "saved alternate provider can be activated with blank input");
      needsKey = true;
      health = { ok: false, reason: "DECISION_KEY_MISSING" };
      await until(() => setup.style.display === "flex", "connection dialog can reopen after activating a saved provider");
      connectProvider.value = "openai";
      connectProvider.dispatchEvent(new Event("change", {bubbles:true}));
      key.value = "invalid-example-key";
      setup.querySelector("#codex-decision-test-key").click();
      await until(() => result.textContent === "Invalid", "invalid key result beside Test button");
      key.value = "expired-example-key";
      setup.querySelector("#codex-decision-test-key").click();
      await until(() => result.textContent === "Expired", "expired key result beside Test button");
      key.value = "working-example-key";
      setup.querySelector("#codex-decision-test-key").click();
      await until(() => result.textContent === "OK", "good key result beside Test button");
      check(result.dataset.ok === "true", "success status is green");
      setup.querySelector("#codex-decision-save-key").click();
      await until(() => setup.style.display === "none" && !needsKey, "saving key closes overlay");
      check(key.value === "", "key field cleared after save");
      needsKey = true;
      health = { ok: false, reason: "DECISION_KEY_MISSING" };
      await until(() => setup.style.display === "flex", "onboarding can add a custom connection");
      connectProvider.value = "custom";
      connectProvider.dispatchEvent(new Event("change", { bubbles: true }));
      setup.querySelector("#codex-decision-auth").value = "none";
      setup.querySelector("#codex-decision-auth").dispatchEvent(new Event("change", { bubbles: true }));
      check(key.closest(".field").hidden && setup.querySelector("#codex-decision-password").closest(".field").hidden &&
        setup.querySelector("#codex-decision-connect-link").hidden, "custom anonymous onboarding hides credentials and provider key link");
      const beforeConnectActions = window.__jevHarnessActions.length;
      saveButton.click();
      await until(() => setup.style.display === "none" && window.__jevHarnessProvider === "custom", "custom onboarding tests and saves without an API key");
      check(window.__jevHarnessActions.slice(beforeConnectActions).filter(action => ["testApiKey", "saveApiKey"].includes(action)).join(",") === "testApiKey,saveApiKey" &&
        window.__jevHarnessCustomProvider.auth === "none", "onboarding verifies the complete custom draft before saving");
      window.__jevHarnessHoldNextStatus = true;
      await until(() => window.__jevHarnessHeldStatus?.sessionId === "fixture-session",
        "hold an older reply in the same thread");
      const oldReply = window.__jevHarnessHeldStatus;
      const beforeFreshStatus = calls;
      await until(() => calls > beforeFreshStatus && button.style.color === "rgb(135, 205, 164)",
        "a newer status arrives while an old request is held");
      Date.now = () => actualNow() + 11000;
      await pause(1100);
      Date.now = actualNow;
      check(button.style.color === "rgb(135, 205, 164)" &&
        !document.getElementById("codex-decision-health-reason").textContent.includes("did not respond"),
        "an obsolete status timeout cannot replace a newer healthy reply");
      await pause(300);
      window.dispatchEvent(new MessageEvent("message", { data: {
        type: "codex-decision-reply", id: oldReply.id,
        status: { enabled: false, sessionPending: false, health: null },
      } }));
      await pause(30);
      check(button.style.color !== "rgb(154, 154, 154)",
        "an older reply cannot briefly turn the active thread gray");
      window.__jevHarnessHookActivity = { kind: "error", message: "Synthetic saved hook error. Full output was kept." };
      window.dispatchEvent(new Event("focus"));
      await until(() => button.style.color === "rgb(233, 148, 144)" &&
        document.getElementById("codex-decision-hook-activity").textContent.includes("Synthetic saved hook error"),
        "the composer uses the shared persisted hook activity summary");
      window.__jevHarnessHeldStatus = null;
      window.__jevHarnessHoldNextStatus = true;
      await until(() => window.__jevHarnessHeldStatus?.sessionId === "fixture-session",
        "hold a reply from the previous thread");
      document.documentElement.dataset.codexDecisionRouteKind = "none";
      delete document.documentElement.dataset.codexDecisionSessionId;
      window.__jevHarnessHookActivity = null;
      window.dispatchEvent(new Event("codex-decision-route"));
      await until(() => document.getElementById("codex-decision-button").disabled &&
        button.style.color === "rgb(154, 154, 154)", "home view keeps the toggle gray without a thread");
      check(!document.getElementById("codex-decision-hook-activity").textContent.includes("Synthetic saved hook error"),
        "leaving a failed thread clears its shared hook state before the new reply");
      check(root.dataset.noSession === "true" &&
        button.title === "Open a local Codex thread to turn Decision on or off.",
        "home view explains why session switches are unavailable");
      const homeTip = document.getElementById("codex-decision-tip");
      homeTip.style.display = "block";
      check(getComputedStyle(homeTip).display === "none", "home view suppresses the hover tooltip");
      homeTip.style.removeProperty("display");
      settingsScreen.style.display = "block";
      jevSettings.click();
      await until(() => settingsScreen.querySelector("#codex-decision-settings-panel") &&
        settingsScreen.querySelector("#codex-decision-settings-lifetime-calls").textContent === "126",
        "global settings open from the home view");
      check(settingsScreen.querySelector("#codex-decision-settings-panel h2").textContent === "All sessions",
        "settings totals cover all sessions");
      settingsScreen.querySelector('button[aria-label="General"]').click();
      settingsScreen.style.display = "none";
      window.dispatchEvent(new MessageEvent("message", { data: {
        type: "codex-decision-reply", id: window.__jevHarnessHeldStatus.id,
        status: { enabled: true, sessionPending: false, health: { ok: true } },
      } }));
      await pause(30);
      check(document.getElementById("codex-decision-button").disabled,
        "late reply from an old thread cannot reactivate the home view");
      document.documentElement.dataset.codexDecisionRouteKind = "local";
      document.documentElement.dataset.codexDecisionSessionId = "next-thread";
      await until(() => window.__jevHarnessLastSessionId === "next-thread" &&
        !document.getElementById("codex-decision-button").disabled &&
        root.dataset.noSession === "false",
        "internal Codex navigation activates the new thread without changing the webview URL");
      document.documentElement.dataset.codexDecisionRouteKind = "none";
      delete document.documentElement.dataset.codexDecisionSessionId;
      await until(() => document.getElementById("codex-decision-button").disabled,
        "leaving the internal thread route clears the session");
      check(calls >= 5, "host bridge used");
      document.getElementById("results").textContent = JSON.stringify({ ok: true, calls, viewport: innerWidth, height: innerHeight });
      document.title = "DECISION_BROWSER_PASS";
    }
    run().catch((error) => {
      const control = document.getElementById("codex-decision");
      const button = document.getElementById("codex-decision-button");
      document.getElementById("results").textContent = JSON.stringify({ ok: false, error: error.message,
        composer: document.querySelector(".composer").getBoundingClientRect().width,
        accessRight: document.querySelector(".access").getBoundingClientRect().right,
        iconSrc: document.getElementById("codex-decision-connect-icon")?.getAttribute("src"),
        animation: getComputedStyle(document.querySelector("#codex-decision-connect-art pre")).animationName,
        reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
        modelLeft: document.querySelector(".model").getBoundingClientRect().left,
        buttonWidth: button?.getBoundingClientRect().width, compact: control?.dataset.compact,
        display: control?.style.display, tooltip: document.getElementById("codex-decision-tip")?.textContent,
        settingsOverflow: [...document.querySelectorAll("#codex-decision-settings-panel, #codex-decision-settings-panel *")]
          .filter(node => node.getBoundingClientRect().right > (document.getElementById("codex-decision-settings-panel")?.getBoundingClientRect().right || Infinity) + 1)
          .map(node => ({tag:node.tagName,id:node.id,classes:node.className,width:node.getBoundingClientRect().width,right:node.getBoundingClientRect().right})),
        buttonRight: button?.getBoundingClientRect().right });
      document.title = "DECISION_BROWSER_FAIL";
    });
  </script>
</body>
</html>
