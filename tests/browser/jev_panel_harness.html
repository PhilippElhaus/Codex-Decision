<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jev line panel harness</title>
  <link rel="stylesheet" href="../../vscode-control/webview/jev-panel.css">
  <style>
    body { --vscode-foreground: #d4d4d4; --vscode-descriptionForeground: #969696;
      --vscode-panel-background: #181818; --vscode-editor-background: #181818;
      --vscode-panel-border: #343434; --vscode-charts-blue: #74a9ca;
      --vscode-charts-orange: #d79567; --vscode-editor-font-family: Consolas, monospace;
      --vscode-font-family: "Segoe UI", sans-serif; }
    body.light { --vscode-foreground: #242424; --vscode-descriptionForeground: #616161;
      --vscode-panel-background: #ffffff; --vscode-editor-background: #ffffff;
      --vscode-panel-border: #d4d4d4; --vscode-charts-blue: #2867a8;
      --vscode-charts-orange: #a75a19; }
  </style>
  <script>window.acquireVsCodeApi = () => ({ postMessage() {} });</script>
  <script>
    window.requestAnimationFrame = (callback) => window.setTimeout(() => callback(performance.now()), 16);
    window.cancelAnimationFrame = (timer) => window.clearTimeout(timer);
    window.matchMedia = () => ({ matches: true });
  </script>
</head>
<body>
  <script>if (location.search.includes("light")) document.body.classList.add("light");</script>
  <main id="app" aria-live="polite"></main>
  <script src="../../vscode-control/webview/jev-panel.js"></script>
  <script src="../fixtures/reviewed-test-failure-panel.js"></script>
  <script>
    const row = (line, excerpt, action, canOmit, exactNeeded, taskRelevant, reason) => {
      const resistance = 1 - canOmit;
      const evidence = Math.max(resistance, exactNeeded, taskRelevant ?? 0);
      return { line, excerpt, action, reason, can_omit: canOmit,
        exact_needed: exactNeeded, task_relevant: taskRelevant,
        retention_index: action === "keep" ? .65 + .35 * evidence : .35 * resistance };
    };
    const decision = {
      version: 3, id: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
      receipt_id: "cccccccccccccccccccccccccccccccc", at: "2026-09-29T12:34:56Z",
      filter: "search_listing", status: "candidate", batch_elapsed_ms: 86,
      batch: { number: 1, count: 2, target_count: 6 },
      rows: [row(1, "src/archive.rs:12:routine helper", "omit", .98, .02, .01, "confident_omission"),
        row(2, "src/other.rs:34:unrelated symbol", "omit", .97, .01, .03, "confident_omission"),
        row(3, "src/config.rs:48:required value", "keep", .98, .01, .94, "task_relevant"),
        row(4, "src/auth.rs:72:related setting", "keep", .21, .85, .91, "exact_text"),
        row(5, "src/test.rs:15:routine fixture", "keep", .18, .12, .77, "below_omit_cutoff"),
        row(6, "src/driver.rs:84:completion signal", "keep", .09, .88, .83, "exact_text")],
      totals: { seen: 12, judged: 6, kept: 10, omitted: 2, protected: 0, unjudged: 6, requests: 1 },
    };
    const query = new URLSearchParams(location.search);
    if (query.has("reviewed")) Object.assign(decision, window.JEV_REVIEWED_TEST_FAILURE);
    if (query.has("fifty") || query.has("dense")) {
      const count = query.has("dense") ? 250 : 50;
      const kept = new Set(count === 250 ? [21, 74, 126, 181, 230] : [8, 25, 42]);
      decision.rows = Array.from({ length: count }, (_, index) => row(index + 1,
        `src/synthetic/module_${String(index + 1).padStart(3, "0")}.rs:42:example match in a bounded Jev batch`,
        kept.has(index + 1) ? "keep" : "omit", .98,
        kept.has(index + 1) ? .92 : .02, kept.has(index + 1) ? .94 : .03,
        kept.has(index + 1) ? "task_relevant" : "confident_omission"));
      decision.batch.target_count = count;
      decision.batch.count = 1;
      decision.totals = { seen: count, judged: count, kept: kept.size,
        omitted: count - kept.size, protected: 0, unjudged: 0, requests: 1 };
    }
    const send = (value) => window.dispatchEvent(new MessageEvent("message", {
      data: { type: "decision", decision: value },
    }));
    const positions = () => [".batch-header", ".batch-row:first-child"].map((selector) => {
      const box = document.querySelector(selector).getBoundingClientRect();
      return [box.x, box.y, box.width, box.height].map(Math.round).join(",");
    }).join("|");
    send(decision);
    const report = {};
    let nextDecision;
    report.initialRows = document.querySelectorAll(".batch-row").length;
    report.actualExcerpt = document.querySelector(".batch-excerpt").textContent;
    report.initialWidth = document.querySelector(".batch-bar-fill").getBoundingClientRect().width;
    setTimeout(() => { report.midWidth = document.querySelector(".batch-bar-fill").getBoundingClientRect().width;
      report.midKeepWidth = document.querySelector(".batch-row.keep .batch-bar-fill").getBoundingClientRect().width;
      report.midPercentOpacity = getComputedStyle(document.querySelector(".batch-value")).opacity; }, 350);
    if (query.has("capture")) {
      setTimeout(() => { document.title = "JEV_LINE_PANEL_READY"; }, 1300);
    } else {
    setTimeout(() => { report.finalWidth = document.querySelector(".batch-bar-fill").getBoundingClientRect().width;
      report.finalKeepWidth = document.querySelector(".batch-row.keep .batch-bar-fill").getBoundingClientRect().width;
      report.finalPercentOpacity = getComputedStyle(document.querySelector(".batch-value")).opacity;
      report.positions = positions();
      nextDecision = { ...decision, id: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
        batch: { number: 2, count: 2, target_count: decision.rows.length },
        rows: decision.rows.map((item) => ({ ...item, line: item.line + decision.rows.length })),
        totals: { ...decision.totals, judged: decision.totals.seen, unjudged: 0, requests: 2 } };
      send(nextDecision); }, 1250);
    setTimeout(() => {
      const excerpt = document.querySelector(".batch-excerpt");
      const filled = document.querySelector(".batch-bar-fill");
      const width = filled.getBoundingClientRect().width;
      send({ ...nextDecision, status: "keep" });
      report.sameDecisionDidNotRestart = excerpt === document.querySelector(".batch-excerpt") &&
        filled === document.querySelector(".batch-bar-fill") &&
        width === filled.getBoundingClientRect().width;
    }, 1800);
    setTimeout(() => {
      report.newBatchShown = document.querySelector(".batch-summary").textContent.includes("batch 2/2");
      report.keepReasonVisible = [...document.querySelectorAll(".batch-action")].some((node) => node.textContent.includes("task"));
      report.positionsStable = report.positions === positions();
      report.fullBlockBars = [...document.querySelectorAll(".batch-bar-fill")].every((node) => node.textContent.includes("█"));
      report.parallelGrowth = report.initialWidth === 0 && report.midWidth > 0 && report.midWidth < report.finalWidth &&
        report.midKeepWidth > 0 && report.midKeepWidth < report.finalKeepWidth;
      report.fadeAfterGrowth = Number(report.midPercentOpacity) === 0 && Number(report.finalPercentOpacity) > .95;
      report.columns = getComputedStyle(document.querySelector(".batch-list")).gridTemplateColumns.split(" ").length;
      report.keepRightCutLeft = Math.min(...[...document.querySelectorAll(".batch-row.keep .batch-value")].map((node) => Number(node.textContent))) >
        Math.max(...[...document.querySelectorAll(".batch-row.omit .batch-value")].map((node) => Number(node.textContent)));
      report.keepColor = getComputedStyle(document.querySelector(".batch-row.keep .batch-bar-fill")).color;
      report.cutColor = getComputedStyle(document.querySelector(".batch-row.omit .batch-bar-fill")).color;
      report.keptWidth = document.querySelector(".batch-row.keep .batch-bar-fill").getBoundingClientRect().width;
      report.keptTrackWidth = document.querySelector(".batch-row.keep .batch-bar-track").getBoundingClientRect().width;
      report.noNestedScroll = getComputedStyle(document.querySelector(".batch-list")).overflowY === "visible";
      report.horizontalOverflow = document.documentElement.scrollWidth > document.documentElement.clientWidth + 1;
      document.body.dataset.report = JSON.stringify(report);
      document.title = "JEV_LINE_PANEL_READY";
    }, 2300);
    }
  </script>
</body>
</html>
