<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jev line panel harness</title>
  <link rel="stylesheet" href="../../vscode-control/webview/jev-panel.css">
  <style>
    body { --vscode-foreground: #d4d4d4; --vscode-descriptionForeground: #969696;
      --vscode-panel-background: #181818; --vscode-editor-background: #181818;
      --vscode-panel-border: #343434; --vscode-charts-blue: #74a9ca;
      --vscode-charts-orange: #d79567; --vscode-editor-font-family: Consolas, monospace;
      --vscode-font-family: "Segoe UI", sans-serif; }
    body.light { --vscode-foreground: #242424; --vscode-descriptionForeground: #616161;
      --vscode-panel-background: #ffffff; --vscode-editor-background: #ffffff;
      --vscode-panel-border: #d4d4d4; --vscode-charts-blue: #2867a8;
      --vscode-charts-orange: #a75a19; }
  </style>
  <script>window.acquireVsCodeApi = () => ({ postMessage() {} });</script>
  <script>
    window.requestAnimationFrame = (callback) => window.setTimeout(() => callback(performance.now()), 16);
    window.cancelAnimationFrame = (timer) => window.clearTimeout(timer);
  </script>
</head>
<body>
  <script>if (location.search.includes("light")) document.body.classList.add("light");</script>
  <main id="app" aria-live="polite"></main>
  <script src="../../vscode-control/webview/jev-panel.js"></script>
  <script>
    const row = (id, line, excerpt, action, canOmit, exactNeeded, taskRelevant, reason) => ({
      id: `aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-${id}`, line, excerpt,
      summary: `search/listing · line ${line}`, action, reason,
      can_omit: canOmit, exact_needed: exactNeeded, task_relevant: taskRelevant,
    });
    const decision = {
      version: 2, id: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", at: "2026-09-29T12:34:56Z",
      filter: "search_listing", status: "candidate", batch_elapsed_ms: 86,
      recent: [row(1, 1, "src/archive.rs:12:routine helper", "omit", .98, .02, .01, "confident_omission"),
        row(2, 2, "src/other.rs:34:unrelated symbol", "omit", .97, .01, .03, "confident_omission"),
        row(3, 3, "src/config.rs:48:required value", "keep", .98, .01, .94, "task_relevant")],
      totals: { seen: 3, judged: 3, kept: 1, omitted: 2, protected: 0, unjudged: 0, requests: 1 },
    };
    decision.latest = decision.recent.at(-1);
    const send = (value) => window.dispatchEvent(new MessageEvent("message", {
      data: { type: "decision", decision: value },
    }));
    const positions = () => [".line-history", ".line-detail", ".line-signals"].map((selector) => {
      const box = document.querySelector(selector).getBoundingClientRect();
      return [box.x, box.y, box.width, box.height].map(Math.round).join(",");
    }).join("|");
    send(decision);
    const report = {};
    report.initialRows = document.querySelectorAll(".history-row").length;
    report.actualExcerpt = document.querySelector(".line-excerpt").textContent;
    report.initialFilled = document.querySelectorAll(".cell.filled").length;
    setTimeout(() => { report.midFilled = document.querySelectorAll(".cell.filled").length;
      report.midPercentOpacity = getComputedStyle(document.querySelector(".bar-percent")).opacity; }, 350);
    setTimeout(() => { report.finalFilled = document.querySelectorAll(".cell.filled").length;
      report.finalPercentOpacity = getComputedStyle(document.querySelector(".bar-percent")).opacity;
      report.positions = positions();
      const nextRow = row(4, 4, "src/config.rs:72:related setting", "keep", .21, .85, .91, "exact_text");
      send({ ...decision, id: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
        latest: nextRow, recent: [...decision.recent, nextRow],
        totals: { ...decision.totals, seen: 4, judged: 4, kept: 2 } }); }, 1100);
    setTimeout(() => {
      report.newestAtBottom = document.querySelector(".history-row:last-child").textContent.includes("related setting");
      report.positionsStable = report.positions === positions();
      report.fullBlockBars = [...document.querySelectorAll(".cell.filled")].every((node) => node.textContent === "█");
      document.body.dataset.report = JSON.stringify(report);
      document.title = "JEV_LINE_PANEL_READY";
    }, 2150);
  </script>
</body>
</html>
