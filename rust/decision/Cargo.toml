[package]
name = "codex-decision"
version = "0.11.3"
edition = "2021"
license = "MIT"

[lib]
name = "codex_decision"
path = "src/lib.rs"

[[bin]]
name = "decision-hook"
path = "src/bin/decision-hook.rs"

[[bin]]
name = "decisionctl"
path = "src/bin/decisionctl.rs"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "publication"
harness = false

[[bench]]
name = "projection"
harness = false

[dependencies]
chrono = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
