[package]
name = "codex-jev"
version = "0.10.1"
edition = "2021"
license = "MIT"

[lib]
name = "codex_jev"
path = "src/lib.rs"

[[bin]]
name = "jev-hook"
path = "src/bin/jev-hook.rs"

[[bin]]
name = "jevctl"
path = "src/bin/jevctl.rs"

[dependencies]
chrono = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
