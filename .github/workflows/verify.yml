name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --locked -p codex-decision
      - run: node scripts/dummy_matrix.cjs --hook target/debug/decision-hook --jobs 2 --out .local/quality/dummy-ci
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable build --locked -p codex-decision --profile verification
      - run: node scripts/pipeline_interrupt.cjs --hook target/verification/decision-hook --out .local/quality/pipeline-ci-interrupt
      - run: node scripts/pipeline_stress.cjs --hook target/verification/decision-hook --provider openai --concurrency 4 --rounds 6 --lines 256,1024 --faults http,json,oversize,probability,model,timeout --jitter-ms 10 --out .local/quality/pipeline-ci-openai
      - run: node scripts/pipeline_stress.cjs --hook target/verification/decision-hook --provider typesafe --concurrency 4 --rounds 6 --lines 256,1024 --faults http,json,oversize,probability,model,timeout --jitter-ms 10 --out .local/quality/pipeline-ci-typesafe
      - run: npm test --prefix vscode-control
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: ./scripts/build_submission.sh
      - run: ./scripts/build_control.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m pip install playwright==1.63.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 vscode-control/scripts/browser_smoke.py --browser chromium
      - run: python3 vscode-control/scripts/browser_quality.py --rounds 50 --seed 7 --fallback-every 5 --out .local/quality/browser-ci
      - run: node -e 'const fs=require("node:fs"); globalThis.window={}; require("./tests/fixtures/reviewed-test-failure-panel.js"); fs.writeFileSync(".local/quality/resident-panel.json", JSON.stringify(window.DECISION_REVIEWED_TEST_FAILURE));'
      - run: python3 vscode-control/scripts/browser_quality.py --rounds 4 --seed 7 --resident-panels --reload-every 2 --settle-every 1 --fallback-every 2 --panel .local/quality/resident-panel.json --panel tests/fixtures/resident-panel.json --out .local/quality/resident-panel-ci
