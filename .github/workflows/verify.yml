name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --locked -p codex-jev
      - run: node scripts/two_stage_quality.cjs --hook target/debug/jev-hook --out .local/two-stage/offline
      - run: node scripts/two_stage_quality.cjs --holdout --skip-faults --hook target/debug/jev-hook --out .local/two-stage/offline-holdout
      - run: node scripts/two_stage_quality.cjs --batching --skip-faults --hook target/debug/jev-hook --out .local/two-stage/offline-batching
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: npm test --prefix vscode-control
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: ./scripts/build_submission.sh
      - run: ./scripts/build_control.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m pip install playwright==1.63.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 vscode-control/scripts/browser_smoke.py --browser chromium
      - run: python3 vscode-control/scripts/browser_quality.py --rounds 50 --seed 7 --fallback-every 5 --out .local/quality/browser-ci
