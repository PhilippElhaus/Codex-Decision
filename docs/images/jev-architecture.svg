<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Codex Jev architecture</title>
  <desc id="desc">A local Codex tool result reaches the Rust hook. Safety and route checks may leave it whole. Large general output can pass through a Jev Choice gate before independent line checks. Local keep rules determine what Codex sees. The VS Code control reads per-session state and the shared local key is used for TypeSafe requests.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#6699c8"/></marker>
    <style>
      .bg{fill:#151a20}.box{fill:#202832;stroke:#6389a9;stroke-width:2}.side{fill:#1c252d;stroke:#677886;stroke-width:1.5}.text{fill:#e8edf2;font:600 18px system-ui,sans-serif}.sub{fill:#acbdcb;font:14px system-ui,sans-serif}.label{fill:#8ab5dc;font:13px system-ui,sans-serif}.line{fill:none;stroke:#6699c8;stroke-width:2.5;marker-end:url(#arrow)}.thin{fill:none;stroke:#677886;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="18"/>
  <text x="42" y="43" class="text" font-size="23">Codex Jev · local output flow</text>
  <rect class="box" x="38" y="88" width="190" height="86" rx="12"/><text x="58" y="120" class="text">Codex local tool</text><text x="58" y="146" class="sub">Full tool result</text>
  <rect class="box" x="272" y="88" width="190" height="86" rx="12"/><text x="292" y="120" class="text">Rust hook</text><text x="292" y="146" class="sub">PostToolUse</text>
  <rect class="box" x="506" y="88" width="190" height="86" rx="12"/><text x="526" y="120" class="text">Local checks</text><text x="526" y="146" class="sub">Safety, format, route</text>
  <rect class="box" x="740" y="88" width="190" height="86" rx="12"/><text x="760" y="120" class="text">Choice gate</text><text x="760" y="146" class="sub">Large general output</text>
  <rect class="box" x="974" y="88" width="190" height="86" rx="12"/><text x="994" y="120" class="text">Line checks</text><text x="994" y="146" class="sub">Independent Jev Nouls</text>
  <path class="line" d="M228 131H271"/><path class="line" d="M462 131H505"/><path class="line" d="M696 131H739"/><path class="line" d="M930 131H973"/>
  <text x="510" y="198" class="label">Other routes skip Choice</text>
  <path class="thin" d="M650 174V206H1067V174"/>
  <rect class="box" x="974" y="258" width="190" height="88" rx="12"/><text x="994" y="290" class="text">Local keep rules</text><text x="994" y="316" class="sub">Protect evidence</text>
  <rect class="box" x="740" y="258" width="190" height="88" rx="12"/><text x="760" y="290" class="text">Codex receives</text><text x="760" y="316" class="sub">Full or shorter result</text>
  <path class="line" d="M1068 174V257"/><path class="line" d="M974 302H931"/>
  <path class="thin" d="M835 174V257"/><text x="850" y="238" class="label">Keep full if uncertain</text>
  <rect class="side" x="38" y="416" width="258" height="140" rx="12"/><text x="58" y="450" class="text">VS Code control</text><text x="58" y="478" class="sub">Session switches + settings</text><text x="58" y="503" class="sub">Health indicator</text><text x="58" y="528" class="sub">Jev decision panel</text>
  <rect class="side" x="340" y="416" width="258" height="140" rx="12"/><text x="360" y="450" class="text">Private session data</text><text x="360" y="478" class="sub">Config, health, decisions</text><text x="360" y="503" class="sub">Stats and logs</text><text x="360" y="528" class="sub">Exact saved originals</text>
  <rect class="side" x="642" y="416" width="224" height="140" rx="12"/><text x="662" y="450" class="text">Shared local key</text><text x="662" y="478" class="sub">Private .env file</text><text x="662" y="503" class="sub">Never shown in chat</text>
  <rect class="side" x="910" y="416" width="254" height="140" rx="12"/><text x="930" y="450" class="text">TypeSafe API</text><text x="930" y="478" class="sub">Jev Choice + Nouls</text><text x="930" y="503" class="sub">Bounded HTTPS requests</text>
  <path class="thin" d="M296 486H339"/><path class="thin" d="M462 416V202H370V175"/><path class="thin" d="M1164 131H1182V486H1165"/><path class="thin" d="M866 486H909"/>
  <text x="40" y="610" class="sub">Every session has its own settings and records. A failed or uncertain check leaves the full tool result intact.</text>
</svg>
