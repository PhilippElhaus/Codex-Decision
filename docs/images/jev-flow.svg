<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="335" viewBox="0 0 1100 335" role="img" aria-labelledby="title desc">
  <title id="title">Codex Jev output flow</title>
  <desc id="desc">One PostToolUse hook routes repetitive output, test and build logs, and broad search or file listings through local safety gates. Bounded samples or path-group descriptors reach Jev through a Windows helper for typed judgments. Metadata-only results reach the VS Code control. The API key stays in a user-local DPAPI cache.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a8e82"/></marker>
    <style>
      .bg{fill:#191b1b}.card{fill:#252828;stroke:#434c47;stroke-width:1.5}.key{fill:#222b27;stroke:#537763;stroke-width:1.5}
      .heading{fill:#e5ebe6;font:600 18px 'Segoe UI',Arial,sans-serif}.body{fill:#aab5ad;font:14px 'Segoe UI',Arial,sans-serif}
      .small{fill:#91a99a;font:13px 'Segoe UI',Arial,sans-serif}.line{fill:none;stroke:#7a8e82;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="335" rx="18"/>
  <text x="34" y="37" fill="#95d4ad" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">OUTPUT DECISION</text>
  <rect class="card" x="34" y="70" width="190" height="112" rx="13"/>
  <text class="heading" x="53" y="105">Codex tool result</text><text class="body" x="53" y="132">PostToolUse output</text><text class="body" x="53" y="153">Bash or text MCP</text>
  <path class="line" d="M224 126 H256"/>
  <rect class="card" x="262" y="70" width="195" height="112" rx="13"/>
  <text class="heading" x="281" y="105">Route + gates</text><text class="body" x="281" y="132">Test · search · output</text><text class="body" x="281" y="153">Size · format · sensitive</text>
  <path class="line" d="M457 126 H489"/>
  <rect class="card" x="495" y="70" width="170" height="112" rx="13"/>
  <text class="heading" x="514" y="105">TypeSafe Jev</text><text class="body" x="514" y="132">One bounded call</text><text class="body" x="514" y="153">Typed judgments</text>
  <path class="line" d="M665 126 H697"/>
  <rect class="card" x="703" y="70" width="165" height="112" rx="13"/>
  <text class="heading" x="722" y="105">Decision log</text><text class="body" x="722" y="132">Metadata only</text><text class="body" x="722" y="153">Counts · latency</text>
  <path class="line" d="M868 126 H900"/>
  <rect class="card" x="906" y="70" width="160" height="112" rx="13"/>
  <text class="heading" x="925" y="105">VS Code</text><text class="body" x="925" y="132">Pulse · tooltip</text><text class="body" x="925" y="153">Last 3 outcomes</text>
  <text x="34" y="225" fill="#95d4ad" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">CREDENTIAL PATH</text>
  <rect class="key" x="34" y="244" width="254" height="61" rx="12"/>
  <text class="heading" x="52" y="271">Key setup</text><text class="small" x="52" y="291">Prompt or optional Vaultwarden</text>
  <path class="line" d="M288 275 H335"/>
  <rect class="key" x="341" y="244" width="253" height="61" rx="12"/>
  <text class="heading" x="359" y="271">Windows DPAPI cache</text><text class="small" x="359" y="291">User-local, outside Git and WSL</text>
  <path class="line" d="M594 275 H641"/>
  <rect class="key" x="647" y="244" width="419" height="61" rx="12"/>
  <text class="heading" x="665" y="271">Windows request helper</text><text class="small" x="665" y="291">Adds the key only when sending the Jev request</text>
  <path d="M852 244 V208 Q852 201 845 201 H580 V182" fill="none" stroke="#7a8e82" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
