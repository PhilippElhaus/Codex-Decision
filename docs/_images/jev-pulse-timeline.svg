<svg xmlns="http://www.w3.org/2000/svg" width="770" height="135" viewBox="0 0 770 135" role="img" aria-labelledby="title desc">
  <title id="title">Jev control activity colors</title>
  <desc id="desc">The enabled control is green, eases into blue when Jev is called, then eases back to green over roughly half a second.</desc>
  <defs><style>.bg{fill:#191b1b}.rail{stroke:#59625d;stroke-width:2}.text{fill:#d8e1da;font:15px 'Segoe UI',Arial,sans-serif}.time{fill:#91a99a;font:13px 'Segoe UI',Arial,sans-serif}</style></defs>
  <rect class="bg" width="770" height="135" rx="16"/>
  <line class="rail" x1="100" y1="57" x2="670" y2="57"/>
  <circle cx="132" cy="57" r="12" fill="#87cda4"/><circle cx="320" cy="57" r="12" fill="#9bbfd4"/><circle cx="480" cy="57" r="12" fill="#83bcf7"/><circle cx="638" cy="57" r="12" fill="#87cda4"/>
  <text class="text" x="94" y="102">Ready</text><text class="text" x="277" y="102">Ease in</text><text class="text" x="443" y="102">Calling</text><text class="text" x="593" y="102">Ease out</text>
  <text class="time" x="294" y="30">~220 ms</text><text class="time" x="511" y="30">~500 ms blue pulse</text>
</svg>
