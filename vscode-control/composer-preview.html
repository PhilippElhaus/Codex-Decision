<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev composer control preview</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #171717; color: #bbb; display: grid; place-items: center; padding: 24px; }
    .stage { width: min(100%, 1010px); }
    .caption { font-size: 12px; color: #777; letter-spacing: .03em; margin: 0 0 13px 7px; }
    .composer { position: relative; min-height: 172px; border: 1px solid #343434; border-radius: 30px; background: #202020; box-shadow: 0 1px 2px #0005; padding: 28px 18px 13px; }
    .placeholder { font-size: clamp(20px, 3vw, 25px); color: #636363; line-height: 1.35; }
    .toolbar { position: absolute; inset: auto 13px 12px 18px; display: flex; align-items: center; gap: 18px; min-height: 38px; white-space: nowrap; }
    .plus { font-size: 34px; font-weight: 250; line-height: 1; color: #c8c8c8; margin-right: 4px; }
    .access { color: #d9b200; font-size: 17px; letter-spacing: .01em; }
    .access::before { content: "♢"; display: inline-grid; place-items: center; width: 22px; height: 22px; border: 2px solid #d1ac00; border-radius: 9px; font-size: 20px; margin-right: 9px; line-height: 12px; }
    .jev-wrap { position: relative; margin-left: 3px; }
    .jev { appearance: none; border: 1px solid transparent; border-radius: 9px; display: inline-flex; align-items: center; gap: 7px; min-width: 57px; justify-content: center; background: transparent; color: #9a9a9a; padding: 5px 8px; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 18px; letter-spacing: .01em; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .jev:hover, .jev[aria-expanded="true"] { background: #2c2c2c; border-color: #454545; }
    .jev:focus-visible, .row:focus-visible { outline: 2px solid #87b9fa; outline-offset: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 15%, transparent); }
    .jev[data-state="connected"] { color: #88cca5; }
    .jev[data-state="unavailable"] { color: #e68f8c; }
    .jev[data-state="calling"] { color: #82baf5; }
    .model { font-size: 17px; color: #bdbdbd; }
    .chevron { display: inline-block; transform: rotate(45deg); border: solid #9a9a9a; border-width: 0 2px 2px 0; padding: 4px; margin-left: 4px; vertical-align: 3px; }
    .divider { width: 1px; height: 28px; background: #373737; margin: 0 3px; }
    .context { font-size: 17px; color: #999; }
    .spacer { flex: 1; }
    .mic { width: 16px; height: 24px; border: 2px solid #bdbdbd; border-radius: 9px; position: relative; margin-right: 17px; }
    .mic::after { content: ""; position: absolute; left: -5px; bottom: -6px; width: 22px; height: 12px; border: 2px solid #bdbdbd; border-top: 0; border-radius: 0 0 12px 12px; }
    .stop { width: 48px; height: 48px; border-radius: 50%; background: #cecece; display: grid; place-items: center; margin-right: 1px; }
    .stop::after { content: ""; width: 14px; height: 14px; border-radius: 2px; background: #212121; }
    .popover, .tip { position: absolute; left: 0; bottom: calc(100% + 12px); background: #282828; border: 1px solid #434343; border-radius: 12px; box-shadow: 0 12px 32px #0008; z-index: 3; }
    .popover { width: 300px; padding: 10px; display: none; }
    .popover.open { display: block; }
    .popover h2 { font-size: 12px; font-weight: 600; color: #a4a4a4; margin: 4px 8px 9px; text-transform: uppercase; letter-spacing: .08em; }
    .row { width: 100%; display: flex; gap: 10px; align-items: center; padding: 10px 8px; border: 0; border-radius: 8px; color: #e5e5e5; background: transparent; text-align: left; cursor: pointer; font: inherit; }
    .row:hover { background: #353535; }
    .check { width: 17px; height: 17px; border: 1px solid #777; border-radius: 5px; flex: none; display: grid; place-items: center; color: #202020; font-size: 13px; }
    .row[aria-checked="true"] .check { background: #89cda5; border-color: #89cda5; }
    .row[aria-checked="true"] .check::after { content: "✓"; }
    .row strong { display: block; font-size: 13px; font-weight: 600; }
    .row small { display: block; font-size: 11px; color: #999; margin-top: 2px; line-height: 1.35; }
    .popover-footer { margin: 8px 8px 3px; font-size: 11px; color: #999; line-height: 1.4; }
    .tip { width: 265px; display: none; padding: 11px 13px; font-size: 12px; line-height: 1.45; color: #d9d9d9; pointer-events: none; }
    .jev-wrap:hover .tip:not(.hidden) { display: block; }
    .tip strong { color: #fff; }
    .tip .muted { color: #a2a2a2; margin-top: 5px; }
    .controls { display: flex; gap: 10px; margin: 17px 7px 0; }
    .controls button { border: 1px solid #474747; border-radius: 7px; background: #272727; color: #c3c3c3; font-family: inherit; font-size: 12px; line-height: 1.2; padding: 7px 10px; cursor: pointer; }
    .controls button:hover { background: #353535; }
    @media (max-width: 700px) { .context, .mic, .divider { display: none; } .toolbar { gap: 9px; } .model { font-size: 14px; } .access { font-size: 14px; } }
  </style>
</head>
<body>
  <main class="stage">
    <p class="caption">COMPOSER PLACEMENT PREVIEW · SIMULATED STATES</p>
    <div class="composer">
      <div class="placeholder">Ask for follow-up changes</div>
      <div class="toolbar">
        <span class="plus" aria-hidden="true">+</span>
        <span class="access">Full access</span>
        <div class="jev-wrap">
          <button id="jev" class="jev" data-state="off" aria-expanded="false" aria-controls="hooks" title="Select Jev hooks"><span class="dot"></span>jev</button>
          <div id="tip" class="tip"><strong id="tip-status">Jev off</strong><div id="tip-detail" class="muted">No hook selected. Click to choose.</div></div>
          <div id="hooks" class="popover" role="group" aria-label="Jev hooks">
            <h2>Jev hooks</h2>
            <button id="hook" class="row" role="checkbox" aria-checked="false"><span class="check"></span><span><strong>PostToolUse · output filter</strong><small>Inspect repetitive Bash output with Jev</small></span></button>
            <p class="popover-footer">Select none to turn Jev off. Codex Jev starts in replace mode.</p>
          </div>
        </div>
        <span class="model">GPT-6 Sol Extra High <span class="chevron"></span></span>
        <span class="divider"></span>
        <span class="context">✧ IDE context</span>
        <span class="spacer"></span>
        <span class="mic" aria-hidden="true"></span>
        <span class="stop" aria-hidden="true"></span>
      </div>
    </div>
    <div class="controls"><button id="call">Simulate Jev call</button><button id="outage">Simulate API failure</button><button id="recover">Simulate recovery</button></div>
  </main>
  <script>
    const button = document.getElementById("jev");
    const hooks = document.getElementById("hooks");
    const hook = document.getElementById("hook");
    const tip = document.getElementById("tip");
    const tipStatus = document.getElementById("tip-status");
    const tipDetail = document.getElementById("tip-detail");
    let enabled = false, healthy = true, last = "No decision recorded yet", timer;
    function render() {
      button.dataset.state = enabled ? healthy ? "connected" : "unavailable" : "off";
      hook.setAttribute("aria-checked", String(enabled));
      tipStatus.textContent = enabled ? healthy ? "Jev connected" : "Jev unavailable" : "Jev off";
      tipDetail.textContent = enabled ? `PostToolUse output filter · ${last}` : "No hook selected. Click to choose.";
    }
    button.addEventListener("click", () => { const open = !hooks.classList.contains("open"); hooks.classList.toggle("open", open); button.setAttribute("aria-expanded", String(open)); tip.classList.toggle("hidden", open); });
    hook.addEventListener("click", () => { enabled = !enabled; last = enabled ? "Waiting for a decision" : "No decision recorded yet"; hooks.classList.remove("open"); button.setAttribute("aria-expanded", "false"); tip.classList.remove("hidden"); render(); });
    document.addEventListener("click", (event) => { if (!event.target.closest(".jev-wrap")) { hooks.classList.remove("open"); button.setAttribute("aria-expanded", "false"); tip.classList.remove("hidden"); } });
    document.getElementById("call").addEventListener("click", () => { if (!enabled) return; clearTimeout(timer); button.dataset.state = "calling"; last = "Jev checking tool output"; tipDetail.textContent = `PostToolUse output filter · ${last}`; timer = setTimeout(() => { last = "Kept original Bash output · 480 ms"; render(); }, 500); });
    document.getElementById("outage").addEventListener("click", () => { healthy = false; last = "API or key unavailable"; render(); });
    document.getElementById("recover").addEventListener("click", () => { healthy = true; last = "Connection verified"; render(); });
    render();
  </script>
</body>
</html>
