<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jev composer illustration</title>
  <style>
    body { margin: 0; background: #191919; color: #bcbcbc; font: 17px "Segoe UI", sans-serif; }
    .composer { position: fixed; left: 22px; right: 22px; bottom: 25px; height: 225px; border: 1px solid #353535; border-radius: 36px; background: #202020; }
    .prompt { margin: 34px 30px; color: #777; font-size: 27px; }
    .toolbar { position: absolute; left: 30px; right: 30px; bottom: 19px; height: 36px; display: flex; align-items: center; gap: 19px; white-space: nowrap; }
    .toolbar button { border: 0; background: none; color: inherit; font: inherit; padding: 0; }
    .plus { font-size: 34px; color: #c9c9c9; line-height: 1; }
    .access { color: #d6b900 !important; font-size: 17px !important; }
    .shield { display: inline-block; margin-right: 10px; border: 2px solid #d6b900; border-radius: 9px 9px 12px 12px; width: 22px; height: 24px; line-height: 21px; font-size: 17px; text-align: center; }
    .model { margin-left: auto; color: #bebebe !important; font-size: 17px !important; }
    .divider { height: 34px; border-left: 1px solid #303030; }
    .context { color: #989898; }
    .mic { color: #b5b5b5; font-size: 26px; }
    .send { display: grid; place-items: center; width: 57px; height: 57px; border-radius: 50%; background: #c5c5c5; color: #202020; font-size: 25px; margin-left: 4px; }
    /* Match the headless screenshot surface to its smaller layout viewport. */
    #codex-jev-pilot { transform: translateY(var(--screenshot-offset, 0px)); }
  </style>
  <script>
    document.documentElement.style.setProperty("--screenshot-offset", `${Math.max(0, outerHeight - innerHeight)}px`);
    const demo = new URLSearchParams(location.search).get("demo") || "tooltip";
    const history = [
      "candidate (observe) · Bash · 12,960 chars · 1,162 ms",
      "kept · mcp__demo__logs · 14,000 chars · 1,310 ms",
      "candidate (observe) · Bash · 12,960 chars · 1,180 ms",
    ];
    window.acquireVsCodeApi = () => ({ postMessage(request) {
      queueMicrotask(() => window.dispatchEvent(new MessageEvent("message", { data: {
        type: "jev-pilot-reply", id: request.id,
        status: {
          enabled: true, health: { ok: true, model: "jev-1.13.0" },
          busy: demo === "pulse", mode: "observe", recent: history[0], history,
          stats: { calls: 9, candidates: 7, kept: 2, replaced: 0, checkedChars: 115640, elapsedMs: 10440, completed: 9 },
        },
      } })));
    } });
  </script>
  <script src="../webview/jev-control.js"></script>
</head>
<body>
  <div class="composer">
    <div class="prompt">Ask for follow-up changes</div>
    <div class="toolbar">
      <span class="plus">+</span>
      <button class="access"><span class="shield">!</span>Full access</button>
      <button class="model">GPT-6 Sol Extra High&nbsp;⌄</button>
      <span class="divider"></span><span class="context">✧&nbsp; IDE context</span>
      <span class="mic">♩</span><span class="send">↑</span>
    </div>
  </div>
  <script>
    const api = acquireVsCodeApi();
    setTimeout(() => {
      document.documentElement.style.setProperty("--screenshot-offset", `${Math.max(0, outerHeight - innerHeight)}px`);
      if (demo !== "composer") document.getElementById("codex-jev-pilot-tip").style.display = "block";
      const anchor = document.querySelector(".access").getBoundingClientRect();
      const button = document.getElementById("codex-jev-pilot-button").getBoundingClientRect();
      document.body.dataset.layout = JSON.stringify({ anchorTop: anchor.top, buttonTop: button.top, screenshotOffset: Math.max(0, outerHeight - innerHeight) });
      document.title = "JEV_VISUAL_READY";
    }, 350);
  </script>
</body>
</html>
