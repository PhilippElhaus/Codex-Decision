<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jev browser harness</title>
  <style>
    body { margin: 0; background: #181818; color: #ccc; font: 16px "Segoe UI", sans-serif; }
    .composer { position: absolute; left: 16px; width: calc(100% - 32px); bottom: 20px; height: 180px; border: 1px solid #333; border-radius: 30px; background: #202020; }
    .prompt { margin: 30px 22px; color: #666; font-size: 25px; }
    .toolbar { position: absolute; left: 25px; right: 25px; bottom: 16px; height: 36px; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
    .access { color: #dcb900; flex: none; }
    .model { box-sizing: border-box; margin-left: auto; flex: none; height: 34px; padding: 6px 12px; border: 0; border-radius: 999px; background: #303030; }
    button { min-height: 44px; }
    .results { position: absolute; top: 16px; left: 16px; font: 12px monospace; }
    .settings-screen { display: none; position: fixed; inset: 0; z-index: 10; background: #181818; }
    .settings-nav { box-sizing: border-box; width: 190px; height: 100%; padding: 22px 12px; border-right: 1px solid #333; }
    .settings-nav button { display: block; width: 100%; margin: 6px 0; padding: 8px 12px; border: 0; border-radius: 6px; background: transparent; color: #ccc; text-align: left; }
    .settings-nav button svg, .settings-nav button img { display: inline-block; width: 16px; height: 16px; margin-right: 10px; vertical-align: middle; }
    .settings-nav [aria-current=page] { background: #303030; }
    .settings-content { position: absolute; inset: 0 0 0 190px; overflow: auto; padding: 30px; }
  </style>
  <script>
    let outputEnabled = false, testBuildEnabled = false, searchListingEnabled = false, needsKey = false, health = { ok: true, model: "jev-1.13.0" }, busy = false, mode = "replace";
    const stats = { calls: 7, candidates: 4, kept: 2, replaced: 1, checkedChars: 90640, savedChars: 6058, estimatedTokensSaved: 1515, elapsedMs: 8120, completed: 7 };
    const history = [
      "replaced · test/build · 6,367 chars · -95%",
      "kept · mcp__demo__logs · 14,000 chars",
      "replaced · Bash · 12,960 chars · -92%",
    ];
    let calls = 0, activeViewId = null, freshView = false;
    window.__jevHarnessLastAction = "";
    window.__jevHarnessSettingsRead = 0;
    window.acquireVsCodeApi = () => ({ postMessage(request) {
      calls += 1;
      window.__jevHarnessLastAction = request.action;
      if (request.action === "settingsRead") window.__jevHarnessSettingsRead += 1;
      if (activeViewId && activeViewId !== request.viewId) freshView = true;
      activeViewId = request.viewId;
      if (request.action === "setSelection") {
        if (request.feature === "test_build") testBuildEnabled = request.enabled;
        else if (request.feature === "search_listing") searchListingEnabled = request.enabled;
        else outputEnabled = request.enabled;
      }
      if (request.action === "retryConnection") health = { ok: true, model: "jev-1.13.0" };
      const keyTest = request.action === "testApiKey" ?
        (request.key === "expired-example-key" ? { ok: false, reason: "JEV_KEY_EXPIRED" } :
          request.key === "invalid-example-key" ? { ok: false, reason: "JEV_HTTP_401" } :
            { ok: true, model: "jev-1.13.0" }) : undefined;
      const keySaved = request.action === "saveApiKey";
      if (keySaved) { needsKey = false; health = { ok: true, model: "jev-1.13.0" }; }
      const settings = request.action === "settingsRead" ? { action: "ready", hasKey: true,
        config: { mode: "replace", thresholds: { output: { routine_min: 90, exact_max: 20, unique_max: 30 },
          test_build: { routine_min: 85, exact_max: 25, unique_max: 35 }, search_listing: {
            summarize_probability_min: 78, summarize_confidence_min: 70, drop_probability_min: 92, drop_confidence_min: 85 } } } } :
        request.action === "settingsSave" ? { action: "saved", hasKey: true } :
          request.action === "settingsTest" ? { action: "tested", result: { ok: true, model: "jev-1.13.0" } } : undefined;
      queueMicrotask(() => window.dispatchEvent(new MessageEvent("message", { data: {
        type: "codex-jev-reply", id: request.id,
        status: { enabled: outputEnabled || testBuildEnabled || searchListingEnabled, outputEnabled, testBuildEnabled, searchListingEnabled, needsKey, keyTest, keySaved, settings, health, busy, mode, recent: freshView ? "No decision recorded yet" : history[0],
          history: freshView ? [] : history,
          stats: freshView ? { calls: 0, candidates: 0, kept: 0, replaced: 0, checkedChars: 0, elapsedMs: 0, completed: 0 } : stats },
      } })));
    } });
  </script>
  <script src="../webview/jev-control.js"></script>
  <script src="../webview/jev-settings.js"></script>
</head>
<body>
  <pre class="results" id="results">pending</pre>
  <div class="composer">
    <div class="prompt">Ask for follow-up changes</div>
    <div class="toolbar"><span>+</span><span class="access" role="button">Full access</span><span class="model" role="button">GPT-6 Sol Extra High</span></div>
  </div>
  <div class="settings-screen" id="settings-screen"><nav class="settings-nav" aria-label="Settings"><div class="settings-items"><div class="settings-item"><button aria-label="General">General</button></div><div class="settings-item"><button aria-label="Voice" aria-current="page"><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg><span>Voice</span></button></div><div class="settings-item"><button aria-label="Configuration">Configuration</button></div></div></nav><div class="settings-content"><main><h1>Voice</h1><p>Voice settings</p></main></div></div>
  <script>
    const api = acquireVsCodeApi();
    const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const check = (condition, label) => { if (!condition) throw new Error(label); };
    async function until(predicate, label) {
      for (let attempt = 0; attempt < 25; attempt += 1) {
        if (predicate()) return;
        await pause(20);
      }
      throw new Error(label);
    }
    async function run() {
      await pause(100);
      const composer = document.querySelector(".composer");
      const root = document.getElementById("codex-jev");
      const button = document.getElementById("codex-jev-button");
      const option = document.getElementById("codex-jev-option");
      const localOption = document.getElementById("codex-jev-test-build");
      const compactOption = document.getElementById("codex-jev-search-listing");
      const label = document.getElementById("codex-jev-label");
      check(root && button && option && localOption && compactOption && root.style.display === "block", "control visible");
      check(button.style.color === "rgb(154, 154, 154)", "disabled gray");
      check([option, localOption, compactOption].map((item) => item.querySelector("strong").textContent).join("|") ===
        "Output filter|Test/build logs|Search/listing", "three concise integration labels");
      check(!document.getElementById("codex-jev-menu").textContent.includes("PostToolUse"), "no repeated hook name");
      const buttonStyle = getComputedStyle(button);
      const modelStyle = getComputedStyle(document.querySelector(".model"));
      check(buttonStyle.borderTopWidth === "0px" && buttonStyle.borderRadius === modelStyle.borderRadius &&
        buttonStyle.backgroundColor === modelStyle.backgroundColor &&
        Math.abs(button.getBoundingClientRect().height - document.querySelector(".model").getBoundingClientRect().height) <= 1,
        "Jev button matches the model pill without a border");
      const modelControl = document.querySelector(".model");
      const accessControl = document.querySelector(".access");
      for (const height of [30, 38, 34]) {
        modelControl.style.height = `${height}px`;
        await until(() => Math.abs(button.getBoundingClientRect().height - height) <= 1 &&
          Math.abs(button.getBoundingClientRect().top - modelControl.getBoundingClientRect().top) <= 1,
          `Jev button tracks ${height}px model height and vertical alignment`);
      }
      const anchor = () => document.querySelector(".access").getBoundingClientRect();
      const model = () => document.querySelector(".model").getBoundingClientRect();
      const rect = () => button.getBoundingClientRect();
      const docked = () => model().left - rect().right;
      check(rect().left > anchor().right && docked() >= 7 && docked() <= 10, "right-docked placement");
      const wideWidth = composer.getBoundingClientRect().width;
      const paneWidth = document.documentElement.getBoundingClientRect().width;
      const gap = model().left - anchor().right - 15;
      const fullWidth = rect().width;
      document.documentElement.style.width = `${paneWidth - 80}px`;
      composer.style.width = `${wideWidth - (gap - fullWidth + 4)}px`;
      await until(() => root.dataset.compact === "true" && root.style.display === "block", "compact after panel resize");
      check(getComputedStyle(label).display === "none", "compact dot only");
      check(rect().left > anchor().right + 3 && docked() >= 7 && docked() <= 10,
        "compact dot docks beside the model control");
      button.click();
      const compactMenu = document.getElementById("codex-jev-menu").getBoundingClientRect();
      check(compactMenu.left >= 11 && compactMenu.right <= innerWidth - 11, "compact menu stays in viewport");
      button.click();
      document.documentElement.style.width = `${paneWidth - 110}px`;
      composer.style.width = `${wideWidth - (gap - fullWidth + 4) - 30}px`;
      modelControl.innerHTML = '<svg width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="currentColor"/></svg>';
      await until(() => model().left - anchor().right > fullWidth + 15 &&
        docked() >= 7 && docked() <= 10,
        "model icon frees room and Jev redocks after the pane narrows");
      check(root.dataset.compact === "true" && getComputedStyle(label).display === "none",
        "Jev stays compact after the model shrinks");
      check(rect().left > anchor().right + 3 && docked() >= 7 && docked() <= 10,
        "compact dot stays docked after the model shrinks");
      document.documentElement.style.width = `${paneWidth - 140}px`;
      composer.style.width = `${wideWidth - (gap - fullWidth + 4) - 50}px`;
      accessControl.setAttribute("aria-label", "Full access");
      accessControl.innerHTML = '<svg width="22" height="22" aria-hidden="true"><path d="M11 1 L20 5 L18 16 L11 21 L4 16 L2 5 Z" fill="currentColor"/></svg>';
      await until(() => model().left - anchor().right > fullWidth + 15 &&
        docked() >= 7 && docked() <= 10,
        "access icon frees room and Jev redocks at a narrower pane width");
      check(root.dataset.compact === "true" && docked() >= 7 && docked() <= 10,
        "Jev stays compact and docked after both Codex controls shrink");
      accessControl.textContent = "Full access";
      accessControl.removeAttribute("aria-label");
      modelControl.textContent = "GPT-6 Sol Extra High";
      composer.style.width = `${wideWidth - (gap - 12)}px`;
      await until(() => root.dataset.compact === "true" && root.style.display === "block", "compact control when toolbar gap closes");
      check(Math.abs(rect().top + rect().height / 2 - anchor().top - anchor().height / 2) <= 1,
        "compact control stays on the toolbar row when the gap closes");
      document.documentElement.style.width = "";
      composer.style.width = "";
      await until(() => root.style.display === "block" && root.dataset.compact === "false", "restore full control after resize");
      check(getComputedStyle(label).display !== "none" && docked() >= 7 && docked() <= 10, "full control redocked");
      accessControl.setAttribute("aria-label", "Full access");
      modelControl.setAttribute("aria-label", "GPT-6 Sol model");
      accessControl.innerHTML = '<svg width="22" height="22" aria-hidden="true"><path d="M11 1 L20 5 L18 16 L11 21 L4 16 L2 5 Z" fill="currentColor"/></svg>';
      modelControl.innerHTML = '<svg width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="currentColor"/></svg>';
      document.documentElement.style.width = `${paneWidth - 100}px`;
      composer.style.width = "300px";
      await until(() => root.style.display === "block" && rect().width > 0, "icon-only controls keep Jev visible");
      button.click();
      check(document.getElementById("codex-jev-menu").dataset.open === "true", "icon-only Jev button opens selection");
      button.click();
      accessControl.removeAttribute("aria-label");
      await until(() => root.style.display === "block", "shield icon fallback keeps Jev visible");
      modelControl.removeAttribute("role");
      await until(() => root.dataset.compact === "true", "missing model control keeps compact Jev visible");
      check(Math.abs(rect().top + rect().height / 2 - anchor().top - anchor().height / 2) <= 1,
        "missing model control keeps Jev on the access row");
      modelControl.setAttribute("role", "button");
      document.documentElement.style.width = "";
      composer.style.width = "";
      accessControl.textContent = "Full access";
      modelControl.textContent = "GPT-6 Sol Extra High";
      await until(() => root.dataset.compact === "false", "text controls restore normal position");
      document.documentElement.style.width = `${paneWidth - 80}px`;
      modelControl.removeAttribute("role");
      modelControl.innerHTML = '<svg width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="currentColor"/></svg>';
      await until(() => root.dataset.compact === "true", "missing model compacts Jev after initial layout");
      document.documentElement.style.width = `${paneWidth - 110}px`;
      modelControl.setAttribute("role", "button");
      await pause(40);
      check(root.dataset.compact === "true" && getComputedStyle(label).display === "none",
        "Jev stays compact when the model icon returns at a narrower width");
      document.documentElement.style.width = "";
      modelControl.textContent = "GPT-6 Sol Extra High";
      await until(() => root.dataset.compact === "false", "wider pane restores full Jev label");
      button.click();
      check(button.getAttribute("aria-expanded") === "true", "menu opens");
      const menu = document.getElementById("codex-jev-menu");
      check(menu.getAttribute("aria-label") === "Jev integrations", "integration menu label");
      check(getComputedStyle(menu).backgroundColor === "rgb(33, 33, 33)" &&
        getComputedStyle(menu).paddingLeft === "6px", "Codex-sized menu surface and gutter");
      document.documentElement.style.setProperty("--vscode-menu-background", "#252525");
      check(getComputedStyle(menu).backgroundColor === "rgb(37, 37, 37)", "menu follows VS Code theme");
      document.documentElement.style.removeProperty("--vscode-menu-background");
      check(getComputedStyle(button).borderTopWidth === "0px" &&
        getComputedStyle(button).borderTopStyle === "none",
        "expanded Jev pill remains borderless");
      option.click();
      await pause(50);
      check(option.getAttribute("aria-checked") === "true", "hook selected");
      check(menu.dataset.open === "true" && button.getAttribute("aria-expanded") === "true",
        "menu stays open after selecting a checkbox");
      check(getComputedStyle(option.querySelector(".codex-jev-check")).backgroundColor === "rgb(58, 131, 247)",
        "selected check uses Codex blue");
      check(button.style.color === "rgb(135, 205, 164)", "connected green");
      const observeBadge = document.getElementById("codex-jev-observe");
      check(getComputedStyle(observeBadge).display === "none", "replacement mode has no observe badge");
      mode = "observe";
      await until(() => root.dataset.observe === "true", "observe mode arrives from settings");
      check(getComputedStyle(observeBadge).display !== "none" && observeBadge.textContent === "OBS", "observe badge visible");
      check(button.style.color === "rgb(135, 205, 164)", "observe mode preserves health color");
      document.documentElement.style.width = `${paneWidth - 80}px`;
      composer.style.width = `${wideWidth - (gap - fullWidth + 4)}px`;
      await until(() => root.dataset.compact === "true" && root.style.display === "block", "observe mode fits compact control");
      check(getComputedStyle(observeBadge).display === "none" && rect().right < model().left - 3,
        "compact observe mode shows only the dot and stays clear of the model");
      document.documentElement.style.width = "";
      composer.style.width = "";
      await until(() => root.dataset.compact === "false", "observe control restores after resize");
      mode = "replace";
      await until(() => root.dataset.observe === "false", "replacement mode restored");
      const tooltip = document.getElementById("codex-jev-tip");
      check(tooltip.textContent.includes("This session") && tooltip.textContent.includes("Recent Actions") &&
        tooltip.textContent.includes("7 checked · 1 replaced · 1,1s avg") &&
        tooltip.textContent.includes("Tokens saved: ~1,515") &&
        !tooltip.textContent.includes("chars checked") && !tooltip.textContent.includes("· replace"),
        "session labels and estimated token savings");
      check(tooltip.querySelector("li strong")?.textContent === "-95%" &&
        !tooltip.querySelector("li")?.textContent.includes("1,2s"), "bold reductions without action timings");
      check(tooltip.querySelectorAll("li").length === 3 && tooltip.textContent.includes("mcp__demo__logs"), "three cross-tool outcomes");
      const firstOutcome = tooltip.querySelector("li");
      check(firstOutcome.getBoundingClientRect().height <= parseFloat(getComputedStyle(firstOutcome).lineHeight) + 1,
        "test/build outcome fits on one line");
      check(getComputedStyle(button).transitionDuration.includes("0.22s"), "blue pulse has eased color transition");
      busy = true;
      await pause(150);
      check(button.style.color === "rgb(131, 188, 247)", "busy blue");
      busy = false;
      health = { ok: false, reason: "JEV_HTTP_401" };
      await pause(150);
      check(button.style.color === "rgb(233, 148, 144)", "failure red");
      const retry = document.getElementById("codex-jev-retry");
      check(tooltip.textContent.includes("API key rejected") && retry.style.display !== "none" &&
        getComputedStyle(tooltip).pointerEvents === "auto" &&
        getComputedStyle(tooltip, "::after").height === "10px", "reachable retry and short failure reason");
      retry.click();
      await until(() => button.style.color === "rgb(135, 205, 164)" && retry.style.display === "none", "manual retry restores connection");
      health = { ok: false, reason: "JEV_HTTP_401" };
      await until(() => button.style.color === "rgb(233, 148, 144)", "failure can be shown again");
      location.hash = "#reopened-thread";
      await until(() => freshView && tooltip.textContent.includes("0 checked") && tooltip.querySelectorAll("li").length === 0,
        "new or reopened thread has no old outcomes");
      option.click();
      await pause(50);
      check(button.style.color === "rgb(154, 154, 154)", "off returns gray");
      localOption.click();
      await pause(50);
      check(localOption.getAttribute("aria-checked") === "true" && option.getAttribute("aria-checked") === "false", "local filter selected independently");
      check(menu.dataset.open === "true", "menu stays open for a second selection");
      check(button.style.color === "rgb(233, 148, 144)", "test/build filter reflects failed Jev health");
      health = { ok: true, model: "jev-1.13.0" };
      await pause(150);
      check(button.style.color === "rgb(135, 205, 164)" && tooltip.textContent.includes("Jev connected"), "test/build filter requires Jev health");
      option.click();
      await pause(50);
      check(localOption.getAttribute("aria-checked") === "true" && option.getAttribute("aria-checked") === "true", "both filters selected");
      localOption.click();
      await pause(50);
      check(localOption.getAttribute("aria-checked") === "false" && option.getAttribute("aria-checked") === "true", "local filter deselected independently");
      compactOption.click();
      await pause(50);
      check(compactOption.getAttribute("aria-checked") === "true" && option.getAttribute("aria-checked") === "true", "search/listing selected independently");
      check(menu.dataset.open === "true", "menu stays open for a third selection");
      check(tooltip.textContent.includes("search/listing"), "search/listing appears in selected mode");
      option.click();
      await pause(50);
      check(compactOption.getAttribute("aria-checked") === "true" && option.getAttribute("aria-checked") === "false", "search/listing remains selected alone");
      compactOption.click();
      await pause(50);
      check(compactOption.getAttribute("aria-checked") === "false" && button.style.color === "rgb(154, 154, 154)", "search/listing can turn off independently");
      document.querySelector(".prompt").click();
      check(menu.dataset.open === "false" && button.getAttribute("aria-expanded") === "false",
        "outside click closes the menu");
      button.click();
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      check(menu.dataset.open === "false", "Escape closes the menu");
      const codexMenu = document.createElement("div");
      codexMenu.innerHTML = '<button role="menuitem"><span>Codex settings</span></button>';
      document.body.append(codexMenu);
      await pause(50);
      check(!codexMenu.querySelector('[data-codex-jev-settings="true"]'), "no Jev item in Codex menu");
      codexMenu.remove();
      const settingsScreen = document.getElementById("settings-screen");
      settingsScreen.style.display = "block";
      await until(() => settingsScreen.querySelector('[data-codex-jev-settings="true"]'), "Jev appears in Codex settings");
      const jevSettings = settingsScreen.querySelector('[data-codex-jev-settings="true"]');
      check(jevSettings.closest(".settings-item").previousElementSibling.textContent.trim() === "Voice", "Jev follows Voice");
      check(jevSettings.textContent.trim() === "Jev", "Jev navigation label");
      check(jevSettings.querySelector('img[src$="jev-icon.png"]'), "Jev navigation uses the probability icon");
      jevSettings.click();
      await until(() => settingsScreen.querySelector("#codex-jev-settings-panel") &&
        settingsScreen.querySelector("#codex-jev-settings-key-state").textContent === "An API key is saved.", "Jev settings render inline");
      check(window.__jevHarnessSettingsRead === 1, "settings load through host bridge");
      check(settingsScreen.querySelector("main").style.display === "none", "Voice content hidden on Jev page");
      check(settingsScreen.querySelector("#codex-jev-settings-output-routine_min").value === "90", "threshold loaded");
      settingsScreen.querySelector("#codex-jev-settings-test").click();
      await until(() => settingsScreen.querySelector("#codex-jev-settings-test-status").textContent === "OK", "saved key test result");
      settingsScreen.querySelector("#codex-jev-settings-save").click();
      await until(() => settingsScreen.querySelector("#codex-jev-settings-message").textContent === "Settings saved.", "settings saved inline");
      settingsScreen.querySelector('button[aria-label="General"]').click();
      check(settingsScreen.querySelector("main").style.display !== "none" &&
        !settingsScreen.querySelector("#codex-jev-settings-panel"), "native settings return after navigation");
      settingsScreen.style.display = "none";
      outputEnabled = true;
      needsKey = true;
      health = { ok: false, reason: "JEV_KEY_MISSING" };
      const setup = document.getElementById("codex-jev-connect");
      await until(() => setup.style.display === "flex", "missing key opens over Codex pane");
      setup.querySelector("#codex-jev-connect-icon").src = "../icon.png";
      const bounds = setup.getBoundingClientRect();
      check(bounds.left === 0 && bounds.top === 0 && bounds.width === innerWidth &&
        bounds.height === innerHeight && setup.parentElement === document.body,
        "setup covers the Codex webview");
      check(setup.textContent.includes("Enter a typesafe.ai API key to use the selected integrations.") &&
        !setup.textContent.includes("Test it here before saving") &&
        !setup.textContent.includes("plugin data directory"), "concise onboarding copy");
      check(getComputedStyle(setup).backgroundColor === "rgb(17, 17, 17)", "opaque setup backdrop hides Codex content");
      const keyLink = setup.querySelector("#codex-jev-connect-link a");
      check(keyLink?.href === "https://console.typesafe.ai/keys" && keyLink.target === "_blank" &&
        getComputedStyle(keyLink.parentElement).textAlign === "center", "TypeSafe key link is centered below actions");
      const footer = setup.querySelector("#codex-jev-connect-footer");
      const saveButton = setup.querySelector("#codex-jev-save-key");
      const skipButton = setup.querySelector("#codex-jev-skip-key");
      check(Math.abs(saveButton.getBoundingClientRect().top - skipButton.getBoundingClientRect().top) < 1 &&
        footer.contains(saveButton) && footer.contains(skipButton), "Save and Skip share a row");
      check(setup.querySelector("#codex-jev-connect-icon").getAttribute("src") === "../icon.png" &&
        getComputedStyle(setup.querySelector("#codex-jev-connect-art pre")).animationName ===
          (matchMedia("(prefers-reduced-motion: reduce)").matches ? "none" : "codex-jev-art-drift"),
        "Jev icon and motion-aware ASCII backdrop");
      setup.querySelector("#codex-jev-skip-key").click();
      check(setup.style.display === "none" && needsKey, "Skip restores Codex without saving a key");
      const missingTip = document.getElementById("codex-jev-tip");
      missingTip.style.display = "block";
      check(missingTip.dataset.needsKey === "true" &&
        missingTip.getBoundingClientRect().width <= 253 &&
        getComputedStyle(missingTip.querySelector("#codex-jev-session-heading")).display === "none" &&
        missingTip.querySelector("#codex-jev-retry").textContent === "Connect",
        "missing-key tooltip is compact and action-oriented");
      missingTip.style.display = "";
      missingTip.querySelector("#codex-jev-retry").click();
      check(setup.style.display === "flex", "tooltip Connect reopens setup");
      skipButton.click();
      button.click();
      const reopen = document.getElementById("codex-jev-open-connect");
      check(reopen.style.display !== "none", "skipped setup remains reachable from Jev menu");
      reopen.click();
      check(setup.style.display === "flex", "Jev menu reopens setup");
      const key = setup.querySelector("#codex-jev-key");
      const result = setup.querySelector("#codex-jev-key-status");
      key.value = "invalid-example-key";
      setup.querySelector("#codex-jev-test-key").click();
      await until(() => result.textContent === "Invalid", "invalid key result beside Test button");
      key.value = "expired-example-key";
      setup.querySelector("#codex-jev-test-key").click();
      await until(() => result.textContent === "Expired", "expired key result beside Test button");
      key.value = "working-example-key";
      setup.querySelector("#codex-jev-test-key").click();
      await until(() => result.textContent === "OK", "good key result beside Test button");
      check(result.dataset.ok === "true", "success status is green");
      setup.querySelector("#codex-jev-save-key").click();
      await until(() => setup.style.display === "none" && !needsKey, "saving key closes overlay");
      check(key.value === "", "key field cleared after save");
      check(calls >= 5, "host bridge used");
      document.getElementById("results").textContent = JSON.stringify({ ok: true, calls });
      document.title = "JEV_BROWSER_PASS";
    }
    run().catch((error) => {
      const control = document.getElementById("codex-jev");
      const button = document.getElementById("codex-jev-button");
      document.getElementById("results").textContent = JSON.stringify({ ok: false, error: error.message,
        composer: document.querySelector(".composer").getBoundingClientRect().width,
        accessRight: document.querySelector(".access").getBoundingClientRect().right,
        iconSrc: document.getElementById("codex-jev-connect-icon")?.getAttribute("src"),
        animation: getComputedStyle(document.querySelector("#codex-jev-connect-art pre")).animationName,
        reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
        modelLeft: document.querySelector(".model").getBoundingClientRect().left,
        buttonWidth: button?.getBoundingClientRect().width, compact: control?.dataset.compact,
        display: control?.style.display, tooltip: document.getElementById("codex-jev-tip")?.textContent,
        buttonRight: button?.getBoundingClientRect().right });
      document.title = "JEV_BROWSER_FAIL";
    });
  </script>
</body>
</html>
